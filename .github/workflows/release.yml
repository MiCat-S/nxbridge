name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate version tag
        run: node --input-type=module -e 'import fs from "node:fs"; const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version; if (process.env.GITHUB_REF_NAME !== "v" + version) throw Error("Tag must match package.json version");'
      - name: Wait for the mac gate of this commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 76); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&per_page=1" --jq '.workflow_runs[0].id // empty')
            if [ -z "$run" ] && [ "$attempt" -ge 6 ]; then
              echo "::error::No CI run on main for $GITHUB_SHA; push the commit to main before tagging."; exit 1
            fi
            if [ -n "$run" ]; then
              jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" --jq '[.jobs[] | select(.name == "build" or (.name | startswith("mac gate")))]')
              total=$(jq length <<<"$jobs")
              finished=$(jq '[.[] | select(.status == "completed")] | length' <<<"$jobs")
              passed=$(jq '[.[] | select(.conclusion == "success")] | length' <<<"$jobs")
              if [ "$total" -ge 3 ] && [ "$finished" = "$total" ]; then
                if [ "$passed" = "$total" ]; then echo "run=$run" >> "$GITHUB_OUTPUT"; exit 0; fi
                echo "::error::The mac gate failed in CI run $run; re-run its failed jobs or fix main, then re-run this Release run."; exit 1
              fi
            fi
            sleep 30
          done
          echo "::error::The mac gate of CI run $run did not finish in time; re-run this Release run after it passes."; exit 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: build
          run-id: ${{ steps.gate.outputs.run }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Check the tested ZIP
        run: |
          missing=; command -v 7z >/dev/null || missing="$missing p7zip-full"; command -v bsdtar >/dev/null || missing="$missing libarchive-tools"
          if [ -n "$missing" ]; then sudo apt-get update && sudo apt-get install --yes --no-install-recommends $missing; fi
          node tools/pack-publish.mjs --check
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/releases/*.zip --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
